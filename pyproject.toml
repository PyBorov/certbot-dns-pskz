[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-pskz"
version = "0.1.0"
description = "ps.kz DNS Authenticator plugin for Certbot"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "PyBorov" }]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "certbot>=1.1.0",
    "requests",
]

[project.urls]
Homepage = "https://github.com/PyBorov/certbot-dns-pskz"
Issues = "https://github.com/PyBorov/certbot-dns-pskz/issues"
Changelog = "https://github.com/PyBorov/certbot-dns-pskz/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]

[project.entry-points."certbot.plugins"]
dns-pskz = "certbot_dns_pskz:Authenticator"

[tool.setuptools.packages.find]
include = ["certbot_dns_pskz*"]
